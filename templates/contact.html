{% extends "base.html" %}

{% block title %}Contact Us | SpoofGuard{% endblock %}

{% block content %}
<div class="container py-5 animate-fade">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="glass-panel p-5">
                <h2 class="mb-4">Get in Touch</h2>
                <p class="text-dim mb-4">Have questions about our anti-spoofing technology? Our engineers are here to help.</p>
                
                <form action="{{ url_for('contact') }}" method="POST">
                    <div class="mb-3">
                        <label class="form-label">Full Name</label>
                        <input type="text" name="name" class="form-control" placeholder="John Doe" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Email Address</label>
                        <input type="email" name="email" class="form-control" placeholder="name@company.com" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label">Message</label>
                        <textarea name="message" class="form-control" rows="4" placeholder="How can we help?" required></textarea>
                    </div>
                    <button type="submit" class="btn btn-premium w-100 py-3">Send Message</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
